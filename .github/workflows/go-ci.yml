name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use (defaults to version in go.mod)'
        required: false
        type: string
        default: ''
      goprivate:
        description: >
          GOPRIVATE value for private module access.
          Leave empty for public/OSS repos. Set to e.g. 'github.com/myorg/*'
          only when the repo has private Go module dependencies.
        required: false
        type: string
        default: ''
      build-command:
        required: false
        type: string
        default: 'go build ./...'
      test-command:
        required: false
        type: string
        default: 'go test -race ./...'
      golangci-lint-version:
        required: false
        type: string
        default: 'v2.11.4'
      run-codecov:
        required: false
        type: boolean
        default: false
      run-protobuf:
        required: false
        type: boolean
        default: false
      protoc-version:
        description: 'protoc release to install when run-protobuf is set.'
        required: false
        type: string
        default: '29.3'
      runner:
        description: 'Runner label. Defaults to ubuntu-latest (GitHub-hosted). Pass self-hosted for private repos.'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      GH_PAT:
        description: 'GitHub PAT for private module access. Required when goprivate is set.'
        required: false

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git for private modules
        if: inputs.goprivate != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_KEY_0=url.https://${GH_PAT}@github.com/.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_0=https://github.com/" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: true

      - name: Install protoc tools
        if: inputs.run-protobuf
        env:
          PROTOC_VERSION: ${{ inputs.protoc-version }}
        run: |
          # Install protoc without sudo. Self-hosted runners generally have no
          # passwordless sudo, so `apt-get install protobuf-compiler` fails and
          # leaves `make proto` to die with "protoc: command not found" — while
          # the two go install lines below succeed, which makes the cause
          # non-obvious. Downloading the release archive works on both
          # GitHub-hosted and self-hosted runners.
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already present: $(protoc --version)"
          else
            # Everything lands under RUNNER_TEMP, which is per-job. The three
            # jobs run concurrently, and on self-hosted runners they share a
            # machine — so a fixed path like /tmp/protoc.zip races: one job
            # overwrites the archive while another is extracting it, or deletes
            # it mid-read, surfacing as "BadZipFile: File is not a zip file".
            PROTOC_ZIP="$RUNNER_TEMP/protoc-${PROTOC_VERSION}.zip"
            PROTOC_DIR="$RUNNER_TEMP/protoc-${PROTOC_VERSION}"
            curl -fsSL -o "$PROTOC_ZIP" \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
            # A truncated or error-page download extracts confusingly; check first.
            if ! head -c2 "$PROTOC_ZIP" | grep -q PK; then
              echo "downloaded protoc archive is not a zip:" >&2
              head -c200 "$PROTOC_ZIP" >&2
              exit 1
            fi
            mkdir -p "$PROTOC_DIR"
            # Self-hosted runners may have neither unzip nor python3-zipfile;
            # try both before giving up, since protoc ships only as a .zip.
            if command -v unzip >/dev/null 2>&1; then
              unzip -oq "$PROTOC_ZIP" -d "$PROTOC_DIR"
            elif command -v python3 >/dev/null 2>&1; then
              python3 -m zipfile -e "$PROTOC_ZIP" "$PROTOC_DIR"
              # python3 -m zipfile does not preserve the executable bit.
              chmod +x "$PROTOC_DIR/bin/protoc"
            else
              echo "need unzip or python3 to extract protoc" >&2
              exit 1
            fi
            rm -f "$PROTOC_ZIP"
            echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
            "$PROTOC_DIR/bin/protoc" --version
          fi
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # protoc resolves its plugins from PATH; GOPATH/bin is not always on
          # it for a self-hosted runner.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download
      - run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: inputs.run-codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt

  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
