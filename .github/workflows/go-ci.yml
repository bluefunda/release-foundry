name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use (defaults to version in go.mod)'
        required: false
        type: string
        default: ''
      goprivate:
        description: >
          GOPRIVATE value for private module access.
          Leave empty for public/OSS repos. Set to e.g. 'github.com/myorg/*'
          only when the repo has private Go module dependencies.
        required: false
        type: string
        default: ''
      build-command:
        required: false
        type: string
        default: 'go build ./...'
      test-command:
        required: false
        type: string
        default: 'go test -race ./...'
      golangci-lint-version:
        required: false
        type: string
        default: 'v2.11.4'
      run-codecov:
        required: false
        type: boolean
        default: false
      run-protobuf:
        required: false
        type: boolean
        default: false
      protoc-version:
        description: 'protoc release to install when run-protobuf is set.'
        required: false
        type: string
        default: '29.3'
      runner:
        description: 'Runner label. Defaults to ubuntu-latest (GitHub-hosted). Pass self-hosted for private repos.'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      GH_PAT:
        description: 'GitHub PAT for private module access. Required when goprivate is set.'
        required: false

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git for private modules
        if: inputs.goprivate != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_KEY_0=url.https://${GH_PAT}@github.com/.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_0=https://github.com/" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: true

      - name: Install protoc tools
        if: inputs.run-protobuf
        env:
          PROTOC_VERSION: ${{ inputs.protoc-version }}
        run: |
          # Install protoc without sudo. Self-hosted runners generally have no
          # passwordless sudo, so `apt-get install protobuf-compiler` fails and
          # leaves `make proto` to die with "protoc: command not found" — while
          # the two go install lines below succeed, which makes the cause
          # non-obvious. Downloading the release archive works on both
          # GitHub-hosted and self-hosted runners.
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already present: $(protoc --version)"
          else
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
            mkdir -p "$HOME/.local"
            unzip -oq /tmp/protoc.zip -d "$HOME/.local"
            rm -f /tmp/protoc.zip
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/protoc" --version
          fi
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # protoc resolves its plugins from PATH; GOPATH/bin is not always on
          # it for a self-hosted runner.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download
      - run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: inputs.run-codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt

  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git for private modules
        if: inputs.goprivate != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_KEY_0=url.https://${GH_PAT}@github.com/.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_0=https://github.com/" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: true

      - name: Install protoc tools
        if: inputs.run-protobuf
        env:
          PROTOC_VERSION: ${{ inputs.protoc-version }}
        run: |
          # Install protoc without sudo. Self-hosted runners generally have no
          # passwordless sudo, so `apt-get install protobuf-compiler` fails and
          # leaves `make proto` to die with "protoc: command not found" — while
          # the two go install lines below succeed, which makes the cause
          # non-obvious. Downloading the release archive works on both
          # GitHub-hosted and self-hosted runners.
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already present: $(protoc --version)"
          else
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
            mkdir -p "$HOME/.local"
            unzip -oq /tmp/protoc.zip -d "$HOME/.local"
            rm -f /tmp/protoc.zip
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/protoc" --version
          fi
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # protoc resolves its plugins from PATH; GOPATH/bin is not always on
          # it for a self-hosted runner.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download
      - run: ${{ inputs.build-command }}

  lint:
    name: Lint
    runs-on: ${{ inputs.runner }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git for private modules
        if: inputs.goprivate != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_KEY_0=url.https://${GH_PAT}@github.com/.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_0=https://github.com/" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: true

      - name: Install protoc tools
        if: inputs.run-protobuf
        env:
          PROTOC_VERSION: ${{ inputs.protoc-version }}
        run: |
          # Install protoc without sudo. Self-hosted runners generally have no
          # passwordless sudo, so `apt-get install protobuf-compiler` fails and
          # leaves `make proto` to die with "protoc: command not found" — while
          # the two go install lines below succeed, which makes the cause
          # non-obvious. Downloading the release archive works on both
          # GitHub-hosted and self-hosted runners.
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already present: $(protoc --version)"
          else
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
            mkdir -p "$HOME/.local"
            unzip -oq /tmp/protoc.zip -d "$HOME/.local"
            rm -f /tmp/protoc.zip
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/protoc" --version
          fi
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # protoc resolves its plugins from PATH; GOPATH/bin is not always on
          # it for a self-hosted runner.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download

      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ inputs.golangci-lint-version }}
